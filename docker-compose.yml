version: '3.9'

services:

  # ── Cloudflare Mesh sidecar (official image) ────────────────────────────
  #  Runs warp-svc headlessly in a minimal Wolfi-based container.
  #  Shares the network namespace with the terminal service via
  #  `network_mode: service:cloudflare-mesh` below.
  #  Docs: https://developers.cloudflare.com/cloudflare-one/networks/connectors/cloudflare-mesh/containers/
  cloudflare-mesh:
    image: cloudflare/mesh:latest
    container_name: cloudflare-mesh
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      MESH_NODE_TOKEN: "${MESH_NODE_TOKEN:-}"
      SRCNAT_ENABLED: "true"
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    volumes:
      - mesh_data:/var/lib/cloudflare-warp
    restart: unless-stopped

  # ── TeamDev Terminal ───────────────────────────────────────────────────
  #  Shares the mesh container's network namespace so all terminal traffic
  #  flows through the Cloudflare mesh tunnel.
  terminal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: TeamDevXTerminal
    image: teamdev/terminal:latest
    restart: always
    network_mode: "service:cloudflare-mesh"
    ports:
      - "${PORT:-7681}:${PORT:-7681}"
    environment:
      - PORT=${PORT:-7681}
      - KEEPALIVE_URL=${KEEPALIVE_URL:-}
      - TERM=xterm-256color
      - LANG=en_US.UTF-8
    volumes:
      - uploads:/tmp/teamdev_uploads
      - bash_history:/root/.bash_history_dir
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-7681}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.teamdev.service=terminal"
      - "com.teamdev.version=2.5.0"

volumes:
  uploads:
    driver: local
  bash_history:
    driver: local
  mesh_data:
    driver: local

networks:
  default:
    name: teamdev-net
