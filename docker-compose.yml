version: '3.9'

services:

  # ── TeamDev Terminal (with Cloudflare Tunnel) ───────────────────────────
  #  The terminal image includes the cloudflared binary.  Set TUNNEL_TOKEN
  #  to start a Cloudflare Tunnel at startup via entrypoint.sh.
  terminal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: TeamDevXTerminal
    image: teamdev/terminal:latest
    restart: always
    # ── Capabilities for systemd / systemctl support ──
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    # ── cgroup mount needed by systemd ──
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      - PORT=${PORT:-8080}
      - TERMINAL_PASSWORD=${TERMINAL_PASSWORD:-R@b1u2004@}
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
      - KEEPALIVE_URL=${KEEPALIVE_URL:-}
      - TERM=xterm-256color
      - LANG=en_US.UTF-8
    volumes:
      - uploads:/tmp/teamdev_uploads
      - bash_history:/root/.bash_history_dir
      - cloudflared_data:/root/.cloudflared
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.teamdev.service=terminal"
      - "com.teamdev.version=2.5.0"

volumes:
  uploads:
    driver: local
  bash_history:
    driver: local
  cloudflared_data:
    driver: local

networks:
  default:
    name: teamdev-net
