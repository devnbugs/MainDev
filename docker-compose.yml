version: '3.9'

services:

  terminal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: TeamDevXTerminal
    image: teamdev/terminal:latest
    restart: always
    ports:
      - "${PORT:-7681}:${PORT:-7681}"
    environment:
      - PORT=${PORT:-7681}
      - KEEPALIVE_URL=${KEEPALIVE_URL:-}
      - WARP_TOKEN=${WARP_TOKEN:-}
      - TERM=xterm-256color
      - LANG=en_US.UTF-8
    # ── Cloudflare WARP connector needs these capabilities ──
    #    privileged: true is the simplest; for tighter security use the
    #    cap_add + sysctls block below instead.
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.all.accept_ra=2
    volumes:
      - uploads:/tmp/teamdev_uploads
      - bash_history:/root/.bash_history_dir
      - warp_state:/var/lib/cloudflare-warp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-7681}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.teamdev.service=terminal"
      - "com.teamdev.version=2.5.0"

volumes:
  uploads:
    driver: local
  bash_history:
    driver: local
  warp_state:
    driver: local

networks:
  default:
    name: teamdev-net
