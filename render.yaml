services:
  - type: web
    name: teamdev-terminal
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: TERMINAL_PASSWORD
        sync: false
      - key: TUNNEL_TOKEN
        sync: false
      - key: KEEPALIVE_URL
        fromService:
          type: web
          name: teamdev-terminal
          property: host
